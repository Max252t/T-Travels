openapi: 3.0.3
info:
  title: Т-Путешествия
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Проверить доступность HTTP-сервера
      responses:
        '200':
          description: HTTP-сервер отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Зарегистрировать пользователя
      description: Размер тела запроса ограничен 4 КиБ. При регистрации email приводится к нижнему регистру.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          description: Некорректный запрос (`INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email уже зарегистрирован (`EMAIL_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Тело запроса слишком большое (`REQUEST_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Неподдерживаемый тип или кодировка тела (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Сервер занят обработкой регистраций (`REGISTRATION_BUSY`)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка сервера (`INTERNAL_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Войти по email и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          description: Неверный email или пароль (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '429':
          description: Временно превышен лимит входов (`AUTH_BUSY`)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/AuthInternalError'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Обновить токены
      description: Успешный запрос выдаёт новый refresh-токен и делает предыдущий недействительным.
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthInvalidRefresh'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/AuthInternalError'
  /api/v1/auth/logout:
    post:
      operationId: logoutSession
      summary: Отозвать refresh-сессию
      description: Выданный access-токен действует до истечения своего срока.
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '204':
          description: Сессия отозвана или уже недействительна
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthInvalidRefresh'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/AuthInternalError'
components:
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refresh_token]
            properties:
              refresh_token:
                type: string
                minLength: 43
                maxLength: 43
  responses:
    AuthTokens:
      description: Токены сессии
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokens'
    AuthBadRequest:
      description: Некорректный запрос (`INVALID_REQUEST`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInvalidRefresh:
      description: Refresh-токен недействителен (`INVALID_REFRESH_TOKEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthTooLarge:
      description: Тело запроса больше 4 КиБ (`REQUEST_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthUnsupportedMedia:
      description: Неподдерживаемый тип или кодировка тела (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInternalError:
      description: Ошибка сервера (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          description: Длина email ограничена 254 байтами в UTF-8.
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 15
          maxLength: 128
        name:
          type: string
          description: Пробельные символы по краям удаляются. Имя должно содержать хотя бы один непробельный символ.
          minLength: 1
          maxLength: 100
    RegisteredUser:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 15
          maxLength: 128
    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 43
          maxLength: 43
        expires_in:
          type: integer
          description: Срок действия access-токена в секундах
          minimum: 1
        token_type:
          type: string
          enum: [Bearer]
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

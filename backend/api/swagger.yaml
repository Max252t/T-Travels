openapi: 3.0.3
info:
  title: Т-Путешествия
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Проверить доступность HTTP-сервера
      responses:
        '200':
          description: HTTP-сервер отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Зарегистрировать пользователя
      description: Размер тела запроса ограничен 4 КиБ. При регистрации email приводится к нижнему регистру.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          description: Некорректный запрос (`INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email уже зарегистрирован (`EMAIL_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Тело запроса слишком большое (`REQUEST_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Неподдерживаемый тип или кодировка тела (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Сервер занят обработкой регистраций (`REGISTRATION_BUSY`)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка сервера (`INTERNAL_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Войти по email и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          description: Неверный email или пароль (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '429':
          description: Временно превышен лимит входов (`AUTH_BUSY`)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/AuthInternalError'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Обновить токены
      description: Успешный запрос выдаёт новый refresh-токен и делает предыдущий недействительным.
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthInvalidRefresh'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/AuthInternalError'
  /api/v1/auth/logout:
    post:
      operationId: logoutSession
      summary: Отозвать refresh-сессию
      description: Выданный access-токен действует до истечения своего срока.
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '204':
          description: Сессия отозвана или уже недействительна
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthInvalidRefresh'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/AuthInternalError'
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Получить свой профиль
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль текущего пользователя
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '401':
          description: Требуется действующий access-токен (`INVALID_ACCESS_TOKEN`)
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка получения профиля (`INTERNAL_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/trips:
    get:
      operationId: listTrips
      summary: Мои поездки
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Поездки пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '500':
          $ref: '#/components/responses/TripInternalError'
    post:
      operationId: createTrip
      summary: Создать поездку
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Поездка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '409':
          $ref: '#/components/responses/TripConflict'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}:
    get:
      operationId: getTrip
      summary: Получить поездку
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/SnapshotRevision'
      responses:
        '200':
          headers:
            X-Snapshot-Revision:
              $ref: '#/components/headers/SnapshotRevision'
          description: Поездка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SnapshotRevisionConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
    patch:
      operationId: updateTrip
      summary: Изменить поездку и бюджет
      description: Передайте текущую версию и хотя бы одно изменяемое поле.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripPatch'
      responses:
        '200':
          description: Поездка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/TripForbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/members:
    get:
      operationId: listTripMembers
      summary: Получить участников поездки
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SnapshotRevision'
      responses:
        '200':
          headers:
            X-Snapshot-Revision:
              $ref: '#/components/headers/SnapshotRevision'
          description: Участники поездки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripMember'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SnapshotRevisionConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/invitations:
    post:
      operationId: createTripInvitation
      summary: Выдать код приглашения
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Приглашение действует семь дней
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripInvitation'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/TripForbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/join:
    post:
      operationId: joinTrip
      summary: Присоединиться по коду
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripJoin'
      responses:
        '200':
          description: Поездка участника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '429':
          $ref: '#/components/responses/JoinRateLimited'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: Получить свои уведомления
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Уведомления пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/notifications/{notificationId}/read:
    patch:
      operationId: readNotification
      summary: Отметить уведомление прочитанным
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: Уведомление отмечено
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/NotificationNotFound'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/notifications/read-all:
    post:
      operationId: readAllNotifications
      summary: Отметить все уведомления прочитанными
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Уведомления отмечены
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '409':
          $ref: '#/components/responses/TripConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/budget:
    get:
      operationId: getTripBudget
      summary: Получить бюджет и фактические расходы
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/SnapshotRevision'
      responses:
        '200':
          headers:
            X-Snapshot-Revision:
              $ref: '#/components/headers/SnapshotRevision'
          description: Бюджет поездки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripBudget'
        '400':
          $ref: '#/components/responses/ExpenseBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SnapshotRevisionConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/expenses:
    get:
      operationId: listExpenses
      summary: Получить расходы поездки
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SnapshotRevision'
      responses:
        '200':
          headers:
            X-Snapshot-Revision:
              $ref: '#/components/headers/SnapshotRevision'
          description: Действующие расходы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/ExpenseBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SnapshotRevisionConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
    post:
      operationId: createExpense
      summary: Добавить расход
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Размер тела запроса ограничен 32 КиБ.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Расход создан с рассчитанными долями
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/ExpenseBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/ExpenseConflict'
        '413':
          $ref: '#/components/responses/ExpenseTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/expenses/{expenseId}:
    get:
      operationId: getExpense
      summary: Получить расход и рассчитанные доли
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '200':
          description: Расход и денежные доли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/ExpenseBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '500':
          $ref: '#/components/responses/TripInternalError'
    patch:
      operationId: updateExpense
      summary: Изменить расход
      description: Передайте текущую версию и хотя бы одно изменяемое поле.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Размер тела запроса ограничен 32 КиБ.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePatch'
      responses:
        '200':
          description: Расход обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/ExpenseBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/ExpenseForbidden'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '409':
          $ref: '#/components/responses/ExpenseConflict'
        '413':
          $ref: '#/components/responses/ExpenseTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/TripInternalError'
    delete:
      operationId: deleteExpense
      summary: Удалить расход
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpenseVersionQuery'
      responses:
        '204':
          description: Расход исключён из активных расходов
        '400':
          $ref: '#/components/responses/ExpenseBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/ExpenseForbidden'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '409':
          $ref: '#/components/responses/ExpenseConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/balances:
    get:
      operationId: getTripBalances
      summary: Получить балансы участников
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/SnapshotRevision'
      responses:
        '200':
          headers:
            X-Snapshot-Revision:
              $ref: '#/components/headers/SnapshotRevision'
          description: Балансы участников в копейках
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripBalance'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SnapshotRevisionConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/settlements/suggestions:
    get:
      operationId: getSettlementSuggestions
      summary: Получить рекомендации переводов
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Рекомендации и ревизия расчётов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSuggestions'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/settlements:
    get:
      operationId: listSettlements
      summary: Посмотреть историю имитаций
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SnapshotRevision'
      responses:
        '200':
          headers:
            X-Snapshot-Revision:
              $ref: '#/components/headers/SnapshotRevision'
          description: История переводов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SnapshotRevisionConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
    post:
      operationId: createSettlement
      summary: Имитировать погашение долга
      description: Отправитель определяется Bearer JWT. Можно погасить рекомендованную сумму полностью или частично.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementCreate'
      responses:
        '201':
          description: Перевод записан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/SettlementBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/expenses/{expenseId}/dispute:
    post:
      operationId: openExpenseDispute
      summary: Оспорить расход
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenExpenseDispute'
      responses:
        '201':
          description: Открытый спор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDispute'
        '400':
          $ref: '#/components/responses/DisputeBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '409':
          $ref: '#/components/responses/DisputeConflict'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/expenses/{expenseId}/dispute/resolve:
    post:
      operationId: resolveExpenseDispute
      summary: Закрыть свой спор
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dispute_id]
              properties:
                dispute_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Закрытый спор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDispute'
        '400':
          description: Некорректный запрос или UUID спора (`INVALID_REQUEST`, `INVALID_IDEMPOTENCY_KEY` или `INVALID_DISPUTE_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/DisputeAuthorRequired'
        '404':
          $ref: '#/components/responses/DisputeNotFound'
        '409':
          $ref: '#/components/responses/DisputeConflict'
        '413':
          $ref: '#/components/responses/AuthTooLarge'
        '415':
          $ref: '#/components/responses/AuthUnsupportedMedia'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/leave:
    post:
      operationId: leaveTrip
      summary: Выйти из поездки
      description: Для завершения членства нужны нулевой баланс и отсутствие открытых споров, инициированных участником.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Членство завершено
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripMemberNotFound'
        '409':
          $ref: '#/components/responses/TripMemberConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/members/{userId}:
    delete:
      operationId: removeTripMember
      summary: Исключить участника поездки
      description: Для завершения членства нужны нулевой баланс и отсутствие открытых споров, инициированных участником.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/TripMemberUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Членство завершено
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/TripForbidden'
        '404':
          $ref: '#/components/responses/TripMemberNotFound'
        '409':
          $ref: '#/components/responses/TripMemberConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/expenses/{expenseId}/receipt:
    get:
      operationId: getExpenseReceipt
      summary: Скачать фото чека
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '200':
          description: Приватное изображение чека
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/ReceiptNotFound'
        '429':
          $ref: '#/components/responses/ReceiptBusy'
        '500':
          $ref: '#/components/responses/TripInternalError'
        '503':
          $ref: '#/components/responses/ReceiptStorageUnavailable'
    post:
      operationId: putExpenseReceipt
      summary: Прикрепить или заменить фото чека
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Один фотографический файл JPEG или PNG до 5 МиБ и 12 мегапикселей. Максимальная сторона 4096 пикселей.
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Фото чека сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/ExpenseForbidden'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '409':
          $ref: '#/components/responses/ExpenseConflict'
        '413':
          $ref: '#/components/responses/ReceiptTooLarge'
        '415':
          $ref: '#/components/responses/ReceiptMediaUnsupported'
        '429':
          $ref: '#/components/responses/ReceiptBusy'
        '500':
          $ref: '#/components/responses/TripInternalError'
        '503':
          $ref: '#/components/responses/ReceiptStorageUnavailable'
    delete:
      operationId: deleteExpenseReceipt
      summary: Удалить фото чека
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Чек удалён
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '403':
          $ref: '#/components/responses/ExpenseForbidden'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '409':
          $ref: '#/components/responses/ExpenseConflict'
        '500':
          $ref: '#/components/responses/TripInternalError'
  /api/v1/trips/{tripId}/sync:
    get:
      operationId: syncTrip
      summary: Получить согласованный снимок поездки
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Снимок поездки на одной ревизии
          headers:
            X-Snapshot-Revision:
              $ref: '#/components/headers/SnapshotRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSnapshot'
        '400':
          $ref: '#/components/responses/TripBadRequest'
        '401':
          $ref: '#/components/responses/TripUnauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/SnapshotLimitExceeded'
        '500':
          $ref: '#/components/responses/TripInternalError'
components:
  headers:
    SnapshotRevision:
      description: Ревизия, на которой прочитаны данные поездки.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  parameters:
    SnapshotRevision:
      in: query
      name: revision
      description: Ревизия из X-Snapshot-Revision. Обязательна на страницах с offset больше нуля. При несовпадении начните чтение поездки заново.
      schema:
        type: integer
        format: int64
        minimum: 1
    TripMemberUserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      in: path
      name: expenseId
      required: true
      schema:
        type: string
        format: uuid
    ExpenseVersionQuery:
      in: query
      name: version
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TripId:
      in: path
      name: tripId
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID логической операции. При повторе запроса сохраняйте прежние ключ и значения.
      schema:
        type: string
        format: uuid
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refresh_token]
            properties:
              refresh_token:
                type: string
                minLength: 43
                maxLength: 43
  responses:
    AuthTokens:
      description: Токены сессии
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokens'
    AuthBadRequest:
      description: Некорректный запрос (`INVALID_REQUEST`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInvalidRefresh:
      description: Refresh-токен недействителен (`INVALID_REFRESH_TOKEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthTooLarge:
      description: Тело запроса больше 4 КиБ (`REQUEST_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthUnsupportedMedia:
      description: Неподдерживаемый тип или кодировка тела (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInternalError:
      description: Ошибка сервера (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripBadRequest:
      description: Некорректный запрос (`INVALID_REQUEST`, `INVALID_IDEMPOTENCY_KEY`, `INVALID_SNAPSHOT_REVISION` или `SNAPSHOT_REVISION_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripUnauthorized:
      description: Требуется действующий access-токен (`INVALID_ACCESS_TOKEN`)
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripForbidden:
      description: Действие доступно организатору (`OWNER_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripNotFound:
      description: Поездка не найдена или недоступна (`TRIP_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvitationNotFound:
      description: Приглашение недействительно или истекло (`INVITATION_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotificationNotFound:
      description: Уведомление не найдено (`NOTIFICATION_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripConflict:
      description: Конфликт версии поездки или ключа (`VERSION_CONFLICT` или `IDEMPOTENCY_KEY_REUSED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    JoinRateLimited:
      description: Ограничение частоты присоединения (`JOIN_BUSY`)
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripInternalError:
      description: Ошибка сервера (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExpenseBadRequest:
      description: Некорректный запрос, расход или набор долей (`INVALID_REQUEST`, `INVALID_EXPENSE`, `INVALID_IDEMPOTENCY_KEY`, `INVALID_SNAPSHOT_REVISION` или `SNAPSHOT_REVISION_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExpenseForbidden:
      description: Расход может изменить его автор или организатор (`EXPENSE_EDITOR_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExpenseNotFound:
      description: Поездка или расход не найдены либо недоступны (`TRIP_NOT_FOUND` или `EXPENSE_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExpenseConflict:
      description: Конфликт версии, ключа, общего лимита, открытого спора или баланса бывшего участника (`VERSION_CONFLICT`, `IDEMPOTENCY_KEY_REUSED`, `EXPENSE_LIMIT_EXCEEDED`, `EXPENSE_DISPUTE_OPEN` или `INACTIVE_MEMBER_BALANCE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExpenseTooLarge:
      description: Тело запроса превышает 32 КиБ (`REQUEST_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SettlementBadRequest:
      description: Некорректный запрос (`INVALID_REQUEST`, `INVALID_IDEMPOTENCY_KEY` или `INVALID_SETTLEMENT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SettlementConflict:
      description: Изменилась ревизия, перевод недоступен, ключ уже использован или требуется подтверждение открытых споров (`SETTLEMENT_REVISION_CONFLICT`, `SETTLEMENT_UNAVAILABLE`, `IDEMPOTENCY_KEY_REUSED` или `DISPUTE_ACKNOWLEDGEMENT_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DisputeBadRequest:
      description: Некорректный запрос или причина (`INVALID_REQUEST`, `INVALID_DISPUTE` или `INVALID_IDEMPOTENCY_KEY`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DisputeConflict:
      description: Открытый спор уже существует или ключ использован (`EXPENSE_DISPUTE_OPEN` или `IDEMPOTENCY_KEY_REUSED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DisputeNotFound:
      description: Поездка, расход или открытый спор не найдены (`TRIP_NOT_FOUND`, `EXPENSE_NOT_FOUND` или `DISPUTE_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DisputeAuthorRequired:
      description: Закрыть спор может его инициатор (`DISPUTE_AUTHOR_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripMemberNotFound:
      description: Поездка или участник не найдены (`TRIP_NOT_FOUND` или `MEMBER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TripMemberConflict:
      description: Организатор должен остаться в поездке, у участника есть баланс или открытый спор либо ключ уже использован (`TRIP_OWNER_REQUIRED`, `NONZERO_MEMBER_BALANCE`, `MEMBER_DISPUTE_OPEN` или `IDEMPOTENCY_KEY_REUSED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReceiptNotFound:
      description: Чек не найден или недоступен (`RECEIPT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReceiptTooLarge:
      description: Файл превышает лимит 5 МиБ (`RECEIPT_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReceiptMediaUnsupported:
      description: Ожидается корректное изображение JPEG или PNG (`UNSUPPORTED_RECEIPT_MEDIA`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReceiptBusy:
      description: Слишком много одновременных запросов к чекам (`RECEIPT_BUSY`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReceiptStorageUnavailable:
      description: Хранилище чеков временно недоступно (`RECEIPT_STORAGE_UNAVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SnapshotLimitExceeded:
      description: Больше 1000 записей одного вида, доступны постраничные запросы (`SNAPSHOT_LIMIT_EXCEEDED`)
      headers:
        X-Snapshot-Revision:
          $ref: '#/components/headers/SnapshotRevision'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SnapshotRevisionConflict:
      description: Поездка изменилась во время синхронизации (`SNAPSHOT_REVISION_CONFLICT`)
      headers:
        X-Snapshot-Revision:
          $ref: '#/components/headers/SnapshotRevision'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Receipt:
      type: object
      additionalProperties: false
      required: [content_type, size_bytes, updated_at]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        updated_at:
          type: string
          format: date-time
    TripSnapshot:
      type: object
      additionalProperties: false
      required: [revision, trip, members, expenses, budget, balances, settlements]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        trip:
          $ref: '#/components/schemas/Trip'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TripMember'
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
        budget:
          $ref: '#/components/schemas/TripBudget'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/TripBalance'
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
    OpenExpenseDispute:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ExpenseDispute:
      type: object
      additionalProperties: false
      required: [id, expense_id, created_by, reason, created_at, resolved_at]
      properties:
        id:
          type: string
          format: uuid
        expense_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
    TripBalance:
      type: object
      additionalProperties: false
      required: [user_id, name, balance, active]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        balance:
          type: integer
          format: int64
          description: Положительный баланс означает, что участнику должны.
        active:
          type: boolean
    SettlementTransfer:
      type: object
      additionalProperties: false
      required: [from_user_id, to_user_id, amount]
      properties:
        from_user_id:
          type: string
          format: uuid
        to_user_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 2000000000000
          description: Сумма в копейках.
    SettlementSuggestions:
      type: object
      additionalProperties: false
      required: [revision, optimal, transfers, has_open_disputes]
      description: При количестве ненулевых балансов до 10 включительно optimal равен true и число переводов минимально. Для больших групп optimal равен false.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        optimal:
          type: boolean
        has_open_disputes:
          type: boolean
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/SettlementTransfer'
    SettlementCreate:
      type: object
      additionalProperties: false
      required: [to_user_id, amount, revision]
      properties:
        to_user_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 2000000000000
          description: Сумма в копейках.
        revision:
          type: integer
          format: int64
          minimum: 1
        acknowledge_disputes:
          type: boolean
          default: false
          description: Подтверждение предупреждения о незакрытых спорах.
    Settlement:

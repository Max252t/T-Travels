openapi: 3.0.3
info:
  title: Т-Путешествия
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Проверить доступность HTTP-сервера
      responses:
        '200':
          description: HTTP-сервер отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Зарегистрировать пользователя
      description: Размер тела запроса ограничен 4 КиБ. При регистрации email приводится к нижнему регистру.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          description: Некорректный запрос (`INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email уже зарегистрирован (`EMAIL_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Тело запроса слишком большое (`REQUEST_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Неподдерживаемый тип или кодировка тела (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Сервер занят обработкой регистраций (`REGISTRATION_BUSY`)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка сервера (`INTERNAL_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          description: Длина email ограничена 254 байтами в UTF-8.
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 15
          maxLength: 128
        name:
          type: string
          description: Пробельные символы по краям удаляются. Имя должно содержать хотя бы один непробельный символ.
          minLength: 1
          maxLength: 100
    RegisteredUser:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

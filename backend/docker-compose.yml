services:
  postgres:
    image: postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
    environment:
      POSTGRES_DB: t_travels
      POSTGRES_USER: t_travels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, t_travels, -d, t_travels]
      interval: 2s
      timeout: 3s
      retries: 20

  object-storage:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: ${RECEIPTS_S3_ACCESS_KEY:-t_travels_local}
      RUSTFS_SECRET_KEY: ${RECEIPTS_S3_SECRET_KEY:-t_travels_local_storage_password}
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '127.0.0.1:${RECEIPTS_S3_PORT:-9000}:9000'
    volumes:
      - receipt-data:/data
    command: [/data]

  migrate:
    image: migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://t_travels@postgres:5432/t_travels?sslmode=disable
    command: [up]

volumes:
  postgres-data:
  receipt-data:

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go mod verify
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...
      - run: go build -mod=readonly ./...

  postgres-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: t-travels-ci
      POSTGRES_PASSWORD: ci_test_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Apply and roll back migrations
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm migrate up
          docker compose run --rm migrate down -all
          docker compose run --rm migrate up
          docker compose run --rm migrate up
          result=$(docker compose exec -T postgres psql -XAt -v ON_ERROR_STOP=1 -U t_travels -d t_travels -c "SELECT to_regclass('public.users') IS NOT NULL AND to_regclass('public.refresh_sessions') IS NOT NULL")
          test "$result" = t
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Verify registration with PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://t_travels:ci_test_password@127.0.0.1:5432/t_travels?sslmode=disable
        run: go test -mod=readonly -count=1 -run '^TestRegisterPostgres$' ./cmd/api
      - name: Remove test database
        if: always()
        run: docker compose down --volumes
